<!DOCTYPE html>
<html translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="en" />
    <link rel="stylesheet" href="./main.css" />
    <link rel="icon" type="image/x-icon" href="./img/favicon.png" />
    <title>El Pollo Loco</title>
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/statusbars/status-bar.class.js"></script>
    <script src="./models/statusbars/coin-statusbar.class.js"></script>
    <script src="./models/statusbars/flask-statusbar.class.js"></script>
    <script src="./models/statusbars/health-statusbar.class.js"></script>
    <script src="./models/statusbars/endboss-health-statusbar.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/audio.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/game.js"></script>
    <script src="./js/mobile-fullscreen.js"></script>
  </head>

  <body>
    <div class="content-container">
      <h1>El Pollo Loco</h1>
      <div>
        <div id="canvas-container" class="d-none">
          <canvas id="canvas" width="720" height="480"></canvas>
        </div>

        <div class="info-container">
          <!--<img src="./img/9_intro_outro_screens/start/startscreen_1.png" alt="">-->
          <div class="info-content">
            <div class="game-startBtn">
              <button id="game-startBtn">Start Game</button>
            </div>

            <div class="game-startBtn">
              <button id="game-infoBtn">Controls</button>
            </div>

            <div class="game-startBtn">
              <button id="game-controlBtn">Information</button>
            </div>

          </div>
          <div class="game-howTo d-none">
            <h3>How to Play</h3>
            <p>
              <strong>Desktop:</strong> Arrow keys to move • SPACE to jump • D
              to throw<br />
              <strong>Mobile:</strong> Use on-screen buttons
            </p>
          </div>

          <div class="impress d-none">
            <h4>Controls</h4>
            <p>Defeat chickens and the final boss to win!</p>
          </div>
        </div>
        <!-- Mobile Controls -->
        <div class="mobile-controls">
          <div class="control-group left-controls">
            <button class="btn-mobile btn-left" id="btnLeft">◄</button>
            <button class="btn-mobile btn-right" id="btnRight">►</button>
          </div>
          <div class="control-group right-controls">
            <button class="btn-mobile btn-jump" id="btnJump">JUMP</button>
            <button class="btn-mobile btn-throw" id="btnThrow">THROW</button>
          </div>
        </div>

        <!-- Rotate Device Overlay -->
        <div class="rotate-device-overlay" id="rotateOverlay">
          <div class="rotate-message">
            <div class="rotate-icon">📱 ↻</div>
            <h2>Turn your device</h2>
            <p>Please rotate your device to landscape mode to play</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Fullscreen Button -->
    <button class="fullscreen-btn d-none" id="fullscreenBtn">
      <span class="fullscreen-icon">⛶</span>
    </button>
  </body>
</html>
